<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Arial, Helvetica, sans-serif" font-size="14">
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>

<rect x="20" y="40" width="790" height="196" rx="8" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="62" font-size="13" fill="#444">Вузол на руці робота</text>

<rect x="40" y="82" width="170" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="125" y="111" text-anchor="middle">Лазерний випромінювач</text>
<text x="125" y="131" text-anchor="middle">зелена лінія</text>

<rect x="260" y="82" width="190" height="86" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="355" y="108" text-anchor="middle">Камера HQ, IMX477</text>
<text x="355" y="128" text-anchor="middle">об'єктив 16 мм</text>
<text x="355" y="148" text-anchor="middle">фільтри 532 нм і ND1000</text>

<rect x="495" y="82" width="125" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="557" y="111" text-anchor="middle">Raspberry Pi 4B</text>
<text x="557" y="131" text-anchor="middle">Python, OpenCV</text>

<rect x="680" y="82" width="110" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="735" y="111" text-anchor="middle">Плата RS485</text>
<text x="735" y="131" text-anchor="middle">CAN, ttySC0</text>

<rect x="880" y="82" width="110" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="935" y="111" text-anchor="middle">Контролер R50</text>
<text x="935" y="131" text-anchor="middle">Modbus slave 1</text>

<rect x="880" y="196" width="110" height="62" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="935" y="224" text-anchor="middle">Робот AIR50</text>
<text x="935" y="244" text-anchor="middle">корекція X</text>

<rect x="130" y="326" width="320" height="56" fill="#f1f1f1" stroke="#000" stroke-width="1.5"/>
<text x="290" y="351" text-anchor="middle">Деталь зі стиком</text>
<text x="290" y="370" text-anchor="middle" font-size="12" fill="#444">лазерна лінія ламається на кромках</text>

<rect x="560" y="326" width="200" height="56" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="660" y="351" text-anchor="middle">Ноутбук</text>
<text x="660" y="370" text-anchor="middle" font-size="12" fill="#444">перегляд кадру по VNC</text>

<path d="M125,152 L125,326" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="133" y="250" font-size="12" fill="#444">промінь</text>

<path d="M355,326 L355,168" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="363" y="250" font-size="12" fill="#444">відбита лінія</text>

<path d="M450,125 L495,125" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="472" y="116" text-anchor="middle" font-size="12" fill="#444">CSI</text>

<path d="M620,117 L680,117" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="650" y="108" text-anchor="middle" font-size="12" fill="#444">GPIO</text>

<path d="M790,117 L880,117" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="845" y="108" text-anchor="middle" font-size="12" fill="#444">RS485</text>
<text x="845" y="138" text-anchor="middle" font-size="11" fill="#444">9600 8N1</text>

<path d="M935,152 L935,196" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>

<path d="M557,152 L557,326" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="565" y="250" font-size="12" fill="#444">Wi-Fi</text>

<text x="500" y="412" font-size="12" fill="#444">X1, Y1, X2, Y2 передаються Pi у регістри 0...3, робот зсуває траєкторію по X</text>
